# dream-path. Structured facts only: the name and summary are `title` and `description` in
# index.md. Every key is explained at
# https://dreamweave-mp.github.io/DreamWeave-Mod-Template/guide/mod-toml/

# Permanent identity. Never changes, whatever the crate is called or wherever it is hosted.
id = "75bc8ccd-a1ce-4618-98d8-a757e8862304"

slug = "dream_path"
type = "library"
status = "active"
license = "MIT OR Apache-2.0"

[[maintainers]]
name = "DreamWeave"
url = "https://github.com/DreamWeave-MP"

[links]
documentation = "@/docs/_index.md"
donate = "https://ko-fi.com/magicaldave"

# A Rust library. StroggForge's library workflow (.github/workflows/ci.yml) tests it on every push;
# pushing a bare version tag, like 0.3.0, publishes that version to crates.io and records it here.
[package]
format = "crate"
crate = "dream-path"

# Every version on crates.io, oldest first. To release, add the next one here with the day you
# publish it, set the same version in Cargo.toml, commit, and push its tag: git tag 0.3.0.

[[releases]]
version = "0.1.0"
date = 2026-04-26
summary = "First release: one normalization for virtual resource paths, and NormalizedPath to store it."
added = [
    "`normalize_path`, `normalize_path_owned`, `normalize_path_in_place` and `normalize_path_into`.",
    "`NormalizedPath`, an owned key that normalizes on construction and looks up by borrowed bytes.",
    "`is_normalized_path`, and `parent`, `file_name` and `extension` over normalized bytes.",
    "Lua bindings through `mlua` and LuaJIT, behind the `lua` feature.",
]

[[releases]]
version = "0.1.1"
date = 2026-04-27
changed = [
    "The `lua` feature no longer picks a Lua runtime: the host chooses one through its own `mlua`. `standalone-lua` selects vendored LuaJIT.",
]
added = ["`bstr::ByteSlice` is re-exported."]

[[releases]]
version = "0.1.2"
date = 2026-04-27
changed = ["Rust 1.87, and newer `bstr` and `mlua`."]
fixed = ["The crate documentation no longer links the Lua API when the `lua` feature is off."]

[[releases]]
version = "0.1.3"
date = 2026-04-27
added = ["`bstr` is re-exported as `dream_path::bstr`, so dependents can name its types without depending on it."]
breaking = ["The `ByteSlice` re-export is gone; use `dream_path::bstr::ByteSlice`."]

[[releases]]
version = "0.2.0"
date = 2026-09-26
summary = "The Lua API runs on Luau, with camelCase names."
breaking = [
    "The Lua bindings build against `mlua` 0.12 and Luau. `standalone-lua` now selects Luau.",
    "Lua functions are camelCase (`fileName`, `isUtf8`), and the module's name is `dreamPath`.",
]
added = ["`isNormalized` in Lua."]

[[releases]]
version = "1.0.0"
date = 2026-09-29
summary = "First stable release: the Luau API is an l3i extension providing @dream/path, normalization is faster, and the Rust and Luau APIs are under semver."
breaking = [
    "The `lua` feature binds the crate as an l3i extension, `lua::PathExtension`, providing the module `@dream/path`. `create_module`, `register_module`, `register_module_as` and the `standalone-lua` feature are gone with `mlua`.",
    "Building with the `lua` feature needs l3i's toolchain: clang, lld and cross-language thin LTO.",
    "Rust 1.92.",
]
changed = [
    "An already-normalized path is copied as one block, and the rest folded without branches: a normalized 56-byte key costs 36 ns instead of 91 ns.",
    "A Luau call reads its path as a borrowed view and normalizes into a per-thread buffer, allocating nothing after warm-up; calls take about half as long as with `mlua`.",
    "The definitions check and the strict-script test build behind the `luau-analysis` feature (`cargo test --features luau-analysis`); `cargo test --features lua` does not build Luau's analysis frontend.",
    "l3i 1.0.0 comes from crates.io.",
]
migration = """
Compose `dream_path::lua::PathExtension` into the host's `RuntimePlan`. A host that still wants the
`dreamPath` global adds `RuntimePolicy::compat_global("@dream/path", "dreamPath")`. The functions
and their results are unchanged.
"""

[[releases]]
version = "1.1.0"
date = 2026-09-30
summary = "Relicensed as MIT OR Apache-2.0 and built on l3i 1.1.0."
changed = [
    "Relicensed from GPL-3.0 to MIT OR Apache-2.0: this is the first release under the new terms, and releases up to and including 1.0.0 stay GPL.",
    "l3i 1.1.0 comes from crates.io; the `@dream/path` module is unchanged.",
]
