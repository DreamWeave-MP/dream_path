[package]
name = "dream-path"
version = "1.0.0"
edition = "2024"
rust-version = "1.92"
description = "Byte-first normalized virtual resource paths for DreamWeave/OpenMW-style asset lookup"
readme = "README.md"
homepage = "https://dreamweave-mp.github.io/dream_path/"
documentation = "https://dreamweave-mp.github.io/dream_path/docs/"
repository = "https://github.com/DreamWeave-MP/dream_path"
license = "MIT OR Apache-2.0"
keywords = ["openmw", "vfs", "assets", "paths", "modding"]
categories = ["game-development"]
include = ["src/**", "Cargo.toml", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]
bstr = { version = "1.13.1", default-features = false, features = ["std"] }
l3i = { version = "1.0.0", optional = true }

[features]
default = []
lua = ["dep:l3i"]
# The definitions gate (`RuntimePlan::check_definitions`) needs Luau's analysis frontend. Cargo
# has no optional dev-dependencies, so the typed tests build behind this feature
# (`cargo test --features luau-analysis`) and a plain `cargo test --features lua` skips them.
luau-analysis = ["lua", "l3i/analysis"]

[package.metadata.docs.rs]
features = ["lua"]

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }

[[bench]]
name = "luau_boundary"
harness = false
required-features = ["lua"]

[[bench]]
name = "normalize"
harness = false
