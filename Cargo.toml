[package]
name = "dream-path"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Byte-first normalized virtual resource paths for DreamWeave/OpenMW-style asset lookup"
readme = "README.md"
documentation = "https://dreamweave-mp.github.io/dream_path/dream_path/index.html"
repository = "https://github.com/DreamWeave-MP/dream_path"
license = "GPL-3.0-only"
keywords = ["openmw", "vfs", "assets", "paths", "modding"]
categories = ["game-development"]
include = ["src/**", "Cargo.toml", "README.md", "LICENSE"]

[dependencies]
bstr = { version = "1.13.1", default-features = false, features = ["std"] }
l3i = { path = "../dream-binder", optional = true }

[features]
default = []
lua = ["dep:l3i"]

[package.metadata.docs.rs]
features = ["lua"]

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
# The definitions gate (`RuntimePlan::check_definitions`) needs Luau's analysis frontend.
l3i = { path = "../dream-binder", features = ["analysis"] }

[[bench]]
name = "luau_boundary"
harness = false
required-features = ["lua"]

[[bench]]
name = "normalize"
harness = false
